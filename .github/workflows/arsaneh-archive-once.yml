name: One-time Arsan eh snapshot export
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arsaneh-archive-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build complete site archive
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p = pathlib.Path("arsaneh_repository_snapshot.zip")
          with zipfile.ZipFile(p, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in sorted(pathlib.Path(".").rglob("*")):
                  if f.is_file() and ".git" not in f.parts and f != p:
                      z.write(f, f.as_posix())
          print(p.stat().st_size)
          PY
      - name: Attach archive
        uses: actions/upload-artifact@v4
        with:
          name: arsaneh-complete-site-20261114
          path: arsaneh_repository_snapshot.zip
          retention-days: 3
