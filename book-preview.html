e:.9rem}.hint{text-align:center;color:#cab58f;font-size:.82rem;margin:0 0 15px}@media(max-width:720px){.book{grid-template-columns:1fr;min-height:580px;border-width:7px}.sheet{padding:30px 25px 44px;min-height:580px}.sheet:first-child{border-left:1px solid #c9ae78}.sheet:nth-child(2){display:none}.sheet .lines{font-size:1.05rem;line-height:2.15}.top{justify-content:center;text-align:center}.controls{gap:9px}.controls button{padding:10px 12px}}

</style></head><body><header class="top"><a href="poems.html">← بازگشت به صفحهٔ اصلی اشعار</a><h1>ارسانه | دیوان اشعار</h1><span class="tag">پیش‌نمایش آزمایشی · بدون تغییر سایت اصلی</span></header><main class="wrap"><div class="book" id="book" aria-live="polite"></div><div class="controls"><button id="prev">صفحهٔ پیشین ❯</button><span class="info" id="counter"></span><button id="next">❮ صفحهٔ بعد</button><select id="jump" aria-label="انتخاب شعر"></select></div><p class="hint">ورق‌زدن با دکمه‌ها یا کلیدهای جهت‌دار صفحه‌کلید · در موبایل نمایش تک‌صفحه‌ای</p></main><script>
const poems=[{"n":1,"title":"من دیده‌ام نادیده را","verses":"من دیده‌ام نادیده را، باور نکن،\nآنچه ندیده‌ای، به گفتارم باور نکن.\n\nگفتم که دیده‌ام، نه آنکه شنیده‌ام،\nگفتم شنیده‌ام، نه آنکه دیده‌ام.\n\nاگر گفتم که دیده‌ام،\nشاید همان گفتار، دروغی بیش نباشد؛\nاما نگفتم هرچه گفتم، دروغ است،\nکه هرگز نخواستم دروغی از من برخیزد.\n\nآنچه نشنیده‌ای، باور مکن،\nحتی اگر صد بار گفته باشند؛\nکه شنیده‌ها گاه خیال‌اند\nو حقیقت، فراتر از آواز سخن.\n\nمن از حقیقت می‌گویم،\nاز هر زبان و هر بیان،\nاز مرد و زن،\nاز جان و روح و تن.\n\nحریفی آشکارم،\nاما مرا نه روحی است و نه تنی؛\nچون آتشم، نه روح و تن،\nو خود نمی‌دانم چگونه سخن می‌گویم.\n\nاگر مرا راستین بدانی،\nجز حقیقت از من نخواهی شنید؛\nاما اگر صدها دروغ از من بشنوی،\nشاید حقیقتی در پس هر یک نهفته باشد.\n\nاز مرد و زن چه می‌دانم؟\nاز جان و روح و پیکرشان؟\nاگر به کین و دشمنی وادارم کنند،\nهمان را از زبان من خواهی شنید.\n\nمن حقیقت را به تو می‌گویم،\nاما تو گاه حتی سخن حقیقت را نمی‌شنوی.\n\nمی‌توانی صدها سخن بشنوی،\nو من آنچه بخواهی،\nدر جامهٔ حقیقت پیش چشمت بنمایانم.\n\nاسماعیل!\nتو از من صدها دروغ شنیدی،\nبا درد هم‌آغوش شدی\nو باز سخن گفتی.\n\nپرسیدی: ای صدای در گوش من،\nچرا همچون دو انسان با من سخن نمی‌گویی؟\n\nگفتم آنچه می‌شنوی،\nتمام آن چیزی نیست که می‌پنداری؛\nکه در پس پردهٔ هر سخن،\nرازی پنهان است.\n\nتو روزی به دست خویش\nآتشی در روح افکندی،\nو روزی آن روح برخاست\nتا با من سخن بگوید.\n\nچون سخن آغاز شد،\nپرسیدم که کیستم؛\nدر تحیر آمدش،\nدروغ بود راست.\n\nزلف یار و کج‌ابرویش راست،\nو اگر خواهی حقیقت را بشنوی:\n\nدروغ،\nدروغ،\nراست.","note":"تاریخ سرایش: ۲۹ تیر ۱۴۰۵"},{"n":2,"title":"شرشر باران","verses":"شرشر باران\nنمی‌خواهد صدایم را بشنود؛\nمرتع نمی‌خواهد بروید\nتا چوپان گله‌اش را بچراند.\n\nاین روایت را\nاز تن باران‌خوردهٔ من بشنو.\n\nمگر از مهر و آیین خداوندی\nبی‌خبری؟\nکه در این مسگریِ روزگار،\nزهد و زاهدی\nدر میان ضربه‌های بی‌شمار\nبه محک آزمون آمده‌اند.\n\nآن‌که روزی\nمحرم و همدم تو نبود،\nآن‌که آرام و شکیبا\nدر فراقت سوخت،\nدیگر آن نیست که می‌پنداری.\n\nآن‌که امروز می‌بینی،\nهمان دیروز نیست؛\nاگرچه به ظاهر همچون اوست،\nدیده بگشا\nتا دریابی که این، آن نیست.\n\nاز فراق دلربایی\nچون افسانه،\nروایتی در ارسانه نماند؛\nجز آنچه در قربانگاه اسماعیل\nبه یادگار نشست.","note":""},{"n":3,"title":"ارمغان گلستان","verses":"می‌شود آیا میان لاله‌ها\nعطر گلی را به گلدان آوری؟\n\nاز چمنزار،\nگل‌هایی در سبد بچینی\nو از بوی نرگس و سنبل\nارمغانی آوری؟\n\nبرای آن‌که از عطر تو مست می‌شود،\nهدیه‌ای از گلستان آوری؟\n\nاگر آتش به گلستانم افتد\nو تنها یک گل از آن باقی بماند،\nمی‌شود همان یک گل را\nبرایم ارمغان آوری؟\n\nچون در خلوت خویش\nاز فراق یار بنشینم،\nمبادا زاغ‌رویی را\nبه جای گل برایم آوری.\n\nمن دیگر برای یار\nگلی از گلستان نمی‌چینم؛\nعطر او را می‌جویم،\nشاید نشانی از او\nبه خلوت من آوری.\n\nاگر روی او را ببینم،\nآن خال آهووارش را،\nدیگر از بوی گل\nپریشان نخواهم شد.\n\nمن با یاد او\nسرخوش و مست می‌شوم،\nکاش با ناز نگاهش\nیک دم بوسه‌ای بر لب آوری.\n\nمن دیگر آن کسی نیستم\nکه با هر نامی آرام گیرد؛\nهر جا نشانی از او رسد،\nنامش را برایم آوری.\n\nنه خود او را می‌خواهم\nو نه تنها نام او را؛\nاز خدای یگانه می‌جویم\nکه نامش را\nبه جانم بازآوری.","note":""},{"n":4,"title":"گل‌های من","verses":"گل من،\nگل، گل، گل من،\nگل بی‌قرار من، ارکیده!\n\nالسا،\nآرام بمان،\nای گل نجیب و باوقار من.\n\nدر میان موج موهایت\nدل من بی‌قرار است؛\nبی‌تو حتی لحظه‌ای\nصبر و قرار ندارم.\n\nکنار من بمان،\nای جان پدر.\n\nالسا، خوب بمان،\nارکیده، خوب بمان؛\nکه آرامش شما\nآرامش جان من است.\n\nالسا،\nای نماد قدرت و شکوه،\nتو بودی که پدرت را\nبه اصل و نجابت رساندی.\n\nارکیده،\nای عطر عشق و زیبایی،\nتو بودی که پدرت را\nبه فضیلت و نجابت رساندی.\n\nو تو، ای فسانهٔ من،\nمرا سحر کردی،\nتا در آتش درد خویش بسوزم\nو در میان شعله‌ها\nکمال تو را بجویم.","note":""},{"n":5,"title":"تو مرا گنج نهانی","verses":"تو مرا جان و جهانی،\nجان و جهان چه کنم؟\n\nتو مرا گنج نهانی و عیانی،\nگنج جهان را چه کنم؟\n\nتو مرا لطف فراوان،\nتو مرا مال و منالی،\nتو مرا عشق فراوان،\nتو مرا جاه و جلالی.\n\nتو مرا هرچه که خواهم،\nز تراوت، ز بزرگی،\nز فضیلت، ز شکوه،\nتو مرا هر دو جهانی.\n\nتو مرا از نفس‌های آغاز\nتا به آخرین نفس‌هایم، خدایی.\n\nز تو جویم همهٔ راز،\nتو مرا پرده‌گشایی؛\nبه نگاهی بزدایی\nز دلم هوس‌های فراوان.","note":""},{"n":6,"title":"تو آنی، تو می‌دانی","verses":"تو آن دُرّ گرانی\nمیان من و اهل خانه؛\nتو آن مهر نهانی\nمیان ابروی ساغر.\n\nتو آن پا در رکابی\nبرای خاک‌نشینان؛\nتو آن قلب رئوفی\nبرای نازنازان.\n\nتو آنی،\nتو می‌دانی،\nتو می‌فهمی.\n\nتو آن ابری\nبرای پای گلدان؛\nتو آنی\nبرای هر درد، چاره‌سازی.\n\nتو می‌دانی،\nهوایم هر لحظه طوفانی‌ست.\n\nتو خود دردی\nمیان دردمندان؛\nطبیبم نیست،\nاندیشه‌ام نیست.\n\nچنین رفتار ز مردم،\nکسی پرمهر را پردرد می‌سازد.\n\nمیان لحظه‌های هر درد،\nخودش تنها و تنهاست،\nمیان کمترین درد.","note":""},{"n":7,"title":"زیباترینم، مهرماهی","verses":"تو را من به شکوه فصل نوبهار دیدم،\nز فراق اردیبهشت\nتا شهریور، در آغوش کشیدم.\n\nتو را من، مرا تو،\nبه مهر عهد بستیم؛\nمن و تو، یک پیمان،\nبه مهر، پیمانی بستیم.\n\nشدی محبوبهٔ عقرب‌ماهی،\nمهرماهی؛\nمرا بردی به اعماق وجودت\nهمچو ماهی.\n\nهمان ماهی\nمیان بحر و ماهی؛\nتوی زیبای من،\nزیباترینم، مهرماهی.","note":""},{"n":8,"title":"ز پسِ ظاهر","verses":"روزی نگاهم از جان برون شد،\nدیدم جهانی ناآشنا را؛\nگم‌گشته در خود،\nبی‌پرده گویم:\nلخت و عریان،\nزاهد و شیدا.\n\nعالمی همچو ارسطو،\nدر من این ظاهرم بود؛\nآنچه تو بینی،\nسهراب و لهراسب،\nشمشیر و غلاف است؛\nتیزی نداند\nرازی به پشت دیوار قلعه.\n\nپنهان به نام افکار باشد؛\nپندت: مبین ظاهر،\nحسادت می‌شود؛\nافکار در باطن هویدا می‌شود.\n\nهرگز، چون نسوزد جگرت،\nحال جگرسوخته را ندانی؛\nتو بسوزان جگرت\nتا که حسادت برود،\nآن لحظه که دانی\nافکار ز پسِ ظاهر توست.","note":""},{"n":9,"title":"از گریه تا آغوش","verses":"آن روز که ناتوانی،\nاز گریه دانی دردت چه آید؟\n\nگریه به ناچار،\nپستان مادر،\nهر درد آید، گریه برآری،\nزان‌که رسانی مقصود به مادر.\n\nروزی میان هم‌بازی‌هایت،\nدر رویش خود،\nاز درد دندان...\n\nتا که رسیدی تو نوجوانی،\nپرزور و مغرور،\nاز درد ننالی،\nهرچند در پرده‌گویی:\n«اشکم نیامد، چون من جوانم!»\n\nدر کوه و دریا،\nبین خلایق،\nمردانه گویم:\n«باید ستانم\nدر دستانم زیباترین را!»\n\nآن لحظهٔ شیرین،\nآتشفشانی در بین مردم...\n\nفواره خاموش،\nدر یک شب، آغوش،\nآرام گیرد؛\nروحت شود غرق\nدر روح آن تن.","note":""},{"n":10,"title":"زادروزت مبارک، مهرماهی","verses":"باران نمی‌خواهد صدایم را بشنود،\nباران نمی‌خواهد صفوفش را بشکند.\n\nبا جامه‌ای از حریر سفید آمدم\nتا در آغوشت به آرامش رسم.\n\nاین غزل از فراقت،\nدر سینه شکسته؛\nز آب دیدگانم\nقطره‌قطره بر زمین افتاده\nتا گوید:\n«زادروزت مبارک.»\n\nتا بگویم:\n«من مردی را شکسته‌ام\nکه در یاد تو بود.»\n\nمردمک‌ها را من فشردم\nتا که شوریده‌زاری\nدر بیابانش آرامیده بود.\n\nروزها را از پسِ هفته‌ها\nو ماه‌ها و سالش،\nبه شب و روز گویمت:\n«ای سرو نازم،\nزادروزت مبارک.»\n\nاین‌که خوانم، در تولد،\nدر تحول آورم،\nمن ندانم.\n\nنخواهم که در یادت بمانم،\nآن‌که وقت رفتنش بود.\n\nاین غزل تقدیم تو؛\nنه از مردی که روزی را\nبی‌تحمل،\nناخواسته تو را رنجور خواست.\n\nزادروزت مبارک،\nمهرماهی.","note":""}];const pages=[];const maxLines=15;const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");for(const p of poems){const blocks=p.verses.split(/\n\s*\n/);let current=[],lines=0,part=1;function flush(){if(current.length){pages.push({n:p.n,title:p.title,part:part++,text:current.join("\n\n"),note:p.note});current=[];lines=0}}for(const block of blocks){const bl=block.split("\n");if(lines&&lines+bl.length+1>maxLines)flush();if(bl.length>maxLines){for(let i=0;i<bl.length;i+=maxLines){if(lines)flush();current=[bl.slice(i,i+maxLines).join("\n")];lines=current[0].split("\n").length;flush()}}else{current.push(block);lines+=bl.length+1}}flush()}const book=document.querySelector("#book"),counter=document.querySelector("#counter"),jump=document.querySelector("#jump");let index=0;poems.forEach(p=>{let o=document.createElement("option");o.value=pages.findIndex(x=>x.n===p.n);o.textContent=p.n+" ـ "+p.title;jump.appendChild(o)});const mobile=()=>matchMedia("(max-width:720px)").matches;function render(){const per=mobile()?1:2;index=Math.max(0,Math.min(index,pages.length-1));if(!mobile())index=Math.floor(index/2)*2;book.innerHTML=pages.slice(index,index+per).map((p,i)=>'<section class="sheet"><h2>'+esc(p.title)+'</h2><div class="meta">شعر '+p.n+(p.part>1?' · ادامهٔ '+p.part:'')+(p.note?' · '+esc(p.note):'')+'</div><div class="lines">'+esc(p.text)+'</div><div class="footer"><span>اسماعیل فرهمند</span><span>'+(index+i+1)+'</span></div></section>').join("");counter.textContent="صفحهٔ "+(index+1)+" از "+pages.length;document.querySelector("#prev").disabled=index===0;document.querySelector("#next").disabled=index+per>=pages.length;jump.value=String(pages.findIndex(x=>x.n===pages[index].n))}document.querySelector("#prev").onclick=()=>{index-=mobile()?1:2;render()};document.querySelector("#next").onclick=()=>{index+=mobile()?1:2;render()};jump.onchange=e=>{index=Number(e.target.value);render()};window.addEventListener("resize",render);window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")document.querySelector("#next").click();if(e.key==="ArrowRight")document.querySelector("#prev").click()});render();
</script></body></html>
