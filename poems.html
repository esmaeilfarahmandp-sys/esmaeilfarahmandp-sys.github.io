</style><script src="assets/arsaneh-poems-data.js"></script><main class="stage" aria-label="کتاب مصور اشعار"><section class="paper left"><h2>زادروزت مبارک، مهرماهی</h2><div class="poem" id="left"></div></section><section class="paper right"><h2>زادروزت مبارک، مهرماهی</h2><div class="poem" id="right"></div></section></main><nav class="nav" aria-label="ورق زدن و انتخاب شعر"><select id="pick" aria-label="انتخاب شعر" style="max-width:35%;background:#081522;color:#f5d9ab;border:1px solid #c99b50;border-radius:18px;padding:5px"></select><button id="prev">❯ قبلی</button><span id="counter"></span><button id="next">بعدی ❮</button></nav><script>
const poems=window.ARSANEH_POEMS||[];
const pages=[];
for(const p of poems){
  const blocks=p.verses.split(/\n\s*\n/);
  let buf=[],lines=0,part=1;
  function flush(){if(buf.length){pages.push({n:p.n,title:p.title,part:part++,text:buf.join("\n\n")});buf=[];lines=0;}}
  for(const block of blocks){
    const ls=block.split("\n");
    if(lines && lines+ls.length+1>10)flush();
    if(ls.length>10){
      for(let j=0;j<ls.length;j+=10){if(lines)flush();buf=[ls.slice(j,j+10).join("\n")];lines=buf[0].split("\n").length;flush();}
    }else{buf.push(block);lines+=ls.length+1;}
  }
  flush();
}
const pick=document.getElementById("pick");
poems.forEach(p=>{const o=document.createElement("option");o.value=pages.findIndex(x=>x.n===p.n);o.textContent=p.n+" ـ "+p.title;pick.appendChild(o)});
let i=0;
const portrait=()=>matchMedia("(orientation:portrait) and (max-width:800px)").matches;
function render(){
 document.querySelectorAll(".stage .paper").forEach(el=>{el.classList.remove("page-turning");void el.offsetWidth;el.classList.add("page-turning");});
 const step=portrait()?1:2;
 i=Math.max(0,Math.min(i,pages.length-1));
 if(!portrait())i=Math.floor(i/2)*2;
 const right=pages[i],left=pages[i+1];
 document.getElementById("right").textContent=right?.text||"";
 document.getElementById("left").textContent=portrait()?"":left?.text||"";
 document.querySelector(".paper.right h2").textContent=right && right.part===1 ? right.title : "";
 document.querySelector(".paper.left h2").textContent=left && left.part===1 ? left.title : "";
 document.getElementById("counter").textContent=pages.length?(i+1)+" / "+pages.length:"بارگذاری اشعار…";
 document.getElementById("prev").disabled=i===0;
 document.getElementById("next").disabled=i+step>=pages.length;
 if(right)pick.value=String(pages.findIndex(x=>x.n===right.n));
}
document.getElementById("prev").onclick=()=>{i-=portrait()?1:2;render()};
document.getElementById("next").onclick=()=>{i+=portrait()?1:2;render()};
pick.onchange=e=>{i=Number(e.target.value);render()};
window.addEventListener("resize",render);
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")document.getElementById("next").click();if(e.key==="ArrowRight")document.getElementById("prev").click()});
render();
</script><footer style="position:absolute;top:4px;right:10px;font-size:11px;z-index:12"><a style="color:#e9c98b" href="poems-text.html">متن کامل اشعار</a> · <a style="color:#e9c98b" href="index.html">خانه</a></footer></html>
