<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071321">
  <title>اشعار اسماعیل فرحمند — در حال بازبینی</title>
  <style>
    :root{--navy:#071321;--navy2:#0d2238;--gold:#d9b56d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center}
    main{width:min(760px,90%);padding:48px 28px;border:1px solid rgba(217,181,109,.35);border-radius:24px;background:rgba(255,255,255,.05)}
    h1{color:var(--gold);margin:0 0 18px;font-size:clamp(2rem,6vw,3.4rem)}
    p{line-height:2;margin:8px 0;opacity:.9}
    a{display:inline-block;margin-top:24px;color:var(--gold);text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>اشعار اسماعیل فرحمند</h1>
    <p>این بخش در حال بازبینی و جایگزینی با نسخهٔ نهایی و تأییدشدهٔ اشعار است.</p>
    <p>نسخهٔ قبلی از دسترس عمومی خارج شده است.</p>
    <a href="/">بازگشت به صفحهٔ اصلی</a>
  </main>
</body>
</html>
